<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy or Die</title>
    <style>
        /* Basic page setup */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #333;
            font-family: 'Arial', sans-serif;
        }

        /* Centered container for the game */
        .container {
            width: 800px;
            height: 600px;
            position: relative; /* Establishes a positioning context for the overlays */
            border: 2px solid black;
        }

        /* Canvas element for the game graphics */
        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #f0f0f0; /* A light background for the game itself */
        }

        /* Common styles for all overlay screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75); /* Dark, semi-transparent background */
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Hide screens that should not be visible initially */
        #high-scores-screen,
        #game-over-screen {
            display: none;
        }

        /* Specific styles for the Main Menu */
        #main-menu h1 {
            font-size: 72px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: #ff4500; /* OrangeRed for a striking title */
        }

        #main-menu p {
            font-size: 24px;
            margin: 10px 0;
        }

        /* Specific styles for the Game Over Screen */
        #game-over-screen h2 {
            font-size: 60px;
            color: #dc143c; /* Crimson for "GAME OVER" */
            margin-bottom: 30px;
        }

        #game-over-screen p {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="container">
        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <!-- Main Menu Overlay -->
        <div id="main-menu" class="overlay">
            <h1>Buy or Die</h1>
            <p>Press SPACE to Start</p>
            <p>Press H for High Scores</p>
        </div>

        <!-- High Scores Overlay -->
        <div id="high-scores-screen" class="overlay">
            <!-- High scores content would be dynamically added here -->
            <h2>High Scores</h2>
            <p>Press ESC to return to Main Menu</p>
        </div>

        <!-- Game Over Overlay -->
        <div id="game-over-screen" class="overlay">
            <h2>GAME OVER</h2>
            <p>Press 'R' to Restart or 'M' for the Main Menu</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
